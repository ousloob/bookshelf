# Promtail reads the logs and dumps them into Loki. Then Grafana reads them from
# Loki and displays them in the dashboard. Promtail reads the logs by mounting
# the host /var/log directory into the pods, it requires the right permissions
# for that see ServiceAccount, ClusterRole, and ClusterRoleBinding together
# with serviceAccountName, enableServiceLinks, and securityContext flags in
# the Deployment of the pod.

apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-conf
data:
  loki.yaml: |
    analytics:
      reporting_enabled: false
    auth_enabled: false
    server:
      http_listen_port: 3101
    distributor:
      ring:
        kvstore:
          store: memberlist
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: memberlist
          replication_factor: 1
        final_sleep: 0s
      chunk_idle_period: 5m
      chunk_retain_period: 30s    
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      ring:
        kvstore:
          store: inmemory
      replication_factor: 1
    schema_config:
      configs:
        - from: 2020-05-15
          store: boltdb-shipper
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/index_cache
      filesystem:
        directory: /loki/chunks
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: false
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 5m

---

apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  ports:
    - name: http-loki
      port: 3101
      targetPort: http-loki
  selector:
    app: loki

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      restartPolicy: Always
      containers:
        - name: loki
          image: loki-image
          args:
            - -config.file=/etc/loki/loki.yaml
            - -config.expand-env
          ports:
            - containerPort: 3101
              name: http-loki
              hostPort: 3101
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/loki
            - name: loki-data
              mountPath: /loki
      volumes:
        - name: config-volume
          configMap:
            name: loki-conf
        - name: loki-data
          emptyDir: {}
