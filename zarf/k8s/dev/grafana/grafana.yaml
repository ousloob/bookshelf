apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-conf-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: "aek263duhcrnka"
        url: http://prometheus.bookshelf-system.svc:9090
        access: proxy
        jsonData:
          httpMethod: POST
        version: 1
        editable: true
        isDefault: true
      - name: Loki
        type: loki
        uid: "bek2644uxbpq8d"
        url: http://loki.bookshelf-system.svc:3101
        access: proxy
        jsonData:
          maxLines: 1000
        isDefault: false

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-conf-dashboards
data:
  dashboards.yaml: |
    apiVersion: 1    
    providers:
      - name: dashboards
        type: file
        updateIntervalSeconds: 30
        options:
          path: /etc/dashboards
          foldersFromFilesStructure: true

---

