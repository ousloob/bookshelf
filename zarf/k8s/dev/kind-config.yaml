kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
    # Grafana
    - containerPort: 3100
      hostPort: 3100
    # Postgres
    - containerPort: 15432
      hostPort: 5433
    # Sales:
    - containerPort: 8080
      hostPort: 8080
    # Sales-Api debug
    - containerPort: 8081
      hostPort: 8081
    # Prometheus
    - containerPort: 9090
      hostPort: 9090
