apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: "inventory"
        metrics_path: '/metrics'
        scrape_interval: 5s
        scrape_timeout: 2s
        static_configs:
          - targets: ["inventory.bookshelf-system.svc:8081"]
            labels:
              service: "inventory"
              environment: "develop"

---

apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: prometheus

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prometheus-image
        resources:
          requests:
            memory: "2Gi"
            cpu: "200m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
        ports:
        - name: prometheus
          containerPort: 9090
          hostPort: 9090
        args:
          - "--storage.tsdb.retention.time=5m"
          - "--config.file=/prom-conf/prometheus.yaml"
          - "--storage.tsdb.path=/prometheus/"
          - "--log.level=debug"
        volumeMounts:
        - name: config-volume
          mountPath: /prom-conf/
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
